name: Run Telegram Bot Hourly

on:
  schedule:
    # Chạy lúc 06:32 sáng giờ Việt Nam (23:32 UTC) cho dự báo thời tiết sáng sớm
    - cron: "32 23 * * *"
    # Chạy lúc 07:03 sáng giờ Việt Nam (00:03 UTC) để tránh tắc nghẽn đầu giờ 00:00 UTC
    - cron: "3 0 * * *"
    # Chạy mỗi tiếng 1 lần (dùng phút 17 để tránh delay vào đầu giờ :00)
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      feature:
        description: "Tên 1 tính năng cụ thể để chạy thử (để trống = chạy tất cả)"
        required: false
        default: ""
        type: string

concurrency:
  group: telegram-bot-hourly
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bot state cache
        uses: actions/cache/restore@v4
        with:
          path: .bot_state.json
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bot-state-

      - name: Run bot features once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          GOLD_ENABLED: ${{ vars.GOLD_ENABLED }}
          GOLD_URL: ${{ vars.GOLD_URL }}
          GOLD_TARGET_PRICE: ${{ vars.GOLD_TARGET_PRICE }}
          NEWS_ENABLED: ${{ vars.NEWS_ENABLED }}
          NEWS_RSS_URLS: ${{ vars.NEWS_RSS_URLS }}
          NEWS_SEND_HOUR: ${{ vars.NEWS_SEND_HOUR }}
          NEWS_SEND_MINUTE: ${{ vars.NEWS_SEND_MINUTE }}
          NEWS_TIMEZONE: ${{ vars.NEWS_TIMEZONE }}
          NEWS_MAX_ARTICLES: ${{ vars.NEWS_MAX_ARTICLES }}
          NEWS_MAX_HIGHLIGHTS: ${{ vars.NEWS_MAX_HIGHLIGHTS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          REMINDERS_ENABLED: ${{ vars.REMINDERS_ENABLED }}
          REMINDERS_SEND_HOUR: ${{ vars.REMINDERS_SEND_HOUR }}
          REMINDERS_SEND_MINUTE: ${{ vars.REMINDERS_SEND_MINUTE }}
          REMINDERS_TIMEZONE: ${{ vars.REMINDERS_TIMEZONE }}
          REMINDERS_LEAD_DAYS: ${{ vars.REMINDERS_LEAD_DAYS }}
          REMINDERS_DATA: ${{ vars.REMINDERS_DATA }}
          VOCAB_ENABLED: ${{ vars.VOCAB_ENABLED }}
          VOCAB_TOPIC: ${{ vars.VOCAB_TOPIC }}
          VOCAB_WORDS_PER_BATCH: ${{ vars.VOCAB_WORDS_PER_BATCH }}
          VOCAB_SEND_TIMES: ${{ vars.VOCAB_SEND_TIMES }}
          VOCAB_TIMEZONE: ${{ vars.VOCAB_TIMEZONE }}
          VOCAB_MAX_HISTORY: ${{ vars.VOCAB_MAX_HISTORY }}
          VOCAB_HISTORY: ${{ vars.VOCAB_HISTORY }}
          LUNAR_ENABLED: ${{ vars.LUNAR_ENABLED }}
          LUNAR_SEND_HOUR: ${{ vars.LUNAR_SEND_HOUR }}
          LUNAR_SEND_MINUTE: ${{ vars.LUNAR_SEND_MINUTE }}
          LUNAR_TIMEZONE: ${{ vars.LUNAR_TIMEZONE }}
          LUNAR_LEAD_DAYS: ${{ vars.LUNAR_LEAD_DAYS }}
          LUNAR_MOON_LEAD_DAYS: ${{ vars.LUNAR_MOON_LEAD_DAYS }}
          WEATHER_ENABLED: ${{ vars.WEATHER_ENABLED }}
          WEATHER_CITY: ${{ vars.WEATHER_CITY }}
          WEATHER_LATITUDE: ${{ vars.WEATHER_LATITUDE }}
          WEATHER_LONGITUDE: ${{ vars.WEATHER_LONGITUDE }}
          WEATHER_SEND_HOUR: ${{ vars.WEATHER_SEND_HOUR }}
          WEATHER_SEND_MINUTE: ${{ vars.WEATHER_SEND_MINUTE }}
          WEATHER_TIMEZONE: ${{ vars.WEATHER_TIMEZONE }}
          WEATHER_ALERTS_ENABLED: ${{ vars.WEATHER_ALERTS_ENABLED }}
          WEATHER_ALERT_CHECK_INTERVAL: ${{ vars.WEATHER_ALERT_CHECK_INTERVAL }}
          WEATHER_ALERT_COOLDOWN_MINUTES: ${{ vars.WEATHER_ALERT_COOLDOWN_MINUTES }}
          WEATHER_ALERT_START_HOUR: ${{ vars.WEATHER_ALERT_START_HOUR }}
          WEATHER_ALERT_END_HOUR: ${{ vars.WEATHER_ALERT_END_HOUR }}
          WEATHER_RAIN_LOOKAHEAD_HOURS: ${{ vars.WEATHER_RAIN_LOOKAHEAD_HOURS }}
          WEATHER_RAIN_ALERT_MM: ${{ vars.WEATHER_RAIN_ALERT_MM }}
          WEATHER_RAIN_ALERT_PROB: ${{ vars.WEATHER_RAIN_ALERT_PROB }}
          WEATHER_AQI_THRESHOLD: ${{ vars.WEATHER_AQI_THRESHOLD }}
          BOT_STATE_JSON: ${{ vars.BOT_STATE_JSON }}
          STATE_FILE: .bot_state.json
          INPUT_FEATURE: ${{ inputs.feature }}
        run: |
          if [ -n "$INPUT_FEATURE" ]; then
            python main.py --once --fail-on-error --feature "$INPUT_FEATURE"
          else
            python main.py --once --fail-on-error
          fi

      - name: Save bot state cache
        if: always() && hashFiles('.bot_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .bot_state.json
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}
